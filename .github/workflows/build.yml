name: Build kbd2trigger SPRX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y make git

      - name: Download PS3 toolchain
        run: |
          curl -sL https://github.com/ps3dev/ps3toolchain/releases/download/nightly-2026-10-11/ps3dev-linux-X64.tar.gz \
            | tar xz -C ${HOME}
          echo "PS3DEV=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "${HOME}/ps3dev/bin" >> $GITHUB_PATH
          echo "${HOME}/ps3dev/ppu/bin" >> $GITHUB_PATH

      - name: Clone PSL1GHT and install headers + linker script
        run: |
          git clone --depth=1 https://github.com/ps3dev/PSL1GHT.git /tmp/PSL1GHT
          cp -r /tmp/PSL1GHT/ppu/include/. ${HOME}/ps3dev/ppu/include/
          mkdir -p ${HOME}/ps3dev/ppu/lib
          cp /tmp/PSL1GHT/ppu/crt/lv2.ld ${HOME}/ps3dev/ppu/lib/lv2.ld

      - name: Show GCC specs and available libs (debug)
        run: |
          export PS3DEV=${HOME}/ps3dev
          export PATH=${HOME}/ps3dev/bin:${HOME}/ps3dev/ppu/bin:$PATH
          echo "=== GCC specs ==="
          ppu-gcc -dumpspecs | grep -A5 "lib\|lrt\|llv2" || true
          echo "=== libs in ppu/lib ==="
          ls ${HOME}/ps3dev/ppu/lib/ || true
          echo "=== libs in ppu/powerpc64-ps3-elf/lib ==="
          ls ${HOME}/ps3dev/ppu/powerpc64-ps3-elf/lib/ 2>/dev/null | head -30 || true
          echo "=== gcc internal lib dir ==="
          find ${HOME}/ps3dev -name "*.a" 2>/dev/null | head -20 || true

      - name: Build SPRX
        run: |
          export PS3DEV=${HOME}/ps3dev
          export PSL1GHT=${HOME}/ps3dev
          export PATH=${HOME}/ps3dev/bin:${HOME}/ps3dev/ppu/bin:$PATH
          make

      - name: Upload SPRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbd2trigger-sprx
          path: kbd2trigger.sprx
          if-no-files-found: error
