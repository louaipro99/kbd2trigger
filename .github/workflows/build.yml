name: Build kbd2trigger SPRX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y make

      - name: Download PS3 toolchain (nightly, includes PSL1GHT headers)
        run: |
          curl -sL https://github.com/ps3dev/ps3toolchain/releases/download/nightly-2026-10-11/ps3dev-linux-X64.tar.gz | tar xz -C ${HOME}
          echo "PS3DEV=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "${HOME}/ps3dev/bin" >> $GITHUB_PATH
          echo "${HOME}/ps3dev/ppu/bin" >> $GITHUB_PATH

      - name: Show toolchain layout (debug)
        run: |
          ls ${HOME}/ps3dev/
          ls ${HOME}/ps3dev/ppu/include/ | head -20 || true

      - name: Build SPRX
        run: make

      - name: Upload SPRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbd2trigger-sprx
          path: kbd2trigger.sprx
          if-no-files-found: error
