name: Build kbd2trigger SPRX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo patch wget zlib1g-dev libtool-bin bzip2 pkg-config

      - name: Download PS3 toolchain
        run: |
          curl -sL https://github.com/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz | tar xvz -C ./
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/ps3dev/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/ps3dev/ppu/bin" >> $GITHUB_PATH

      - name: Build SPRX
        run: make

      - name: Upload SPRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbd2trigger-sprx
          path: kbd2trigger.sprx
          if-no-files-found: error
