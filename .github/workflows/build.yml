name: Build kbd2trigger SPRX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y make git libelf-dev libssl-dev pkg-config

      - name: Download PS3 toolchain
        run: |
          curl -sL https://github.com/ps3dev/ps3toolchain/releases/download/nightly-2026-10-11/ps3dev-linux-X64.tar.gz \
            | tar xz -C ${HOME}
          echo "PS3DEV=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${HOME}/ps3dev" >> $GITHUB_ENV
          echo "${HOME}/ps3dev/bin" >> $GITHUB_PATH
          echo "${HOME}/ps3dev/ppu/bin" >> $GITHUB_PATH

      - name: Build and install PSL1GHT (full)
        run: |
          export PS3DEV=${HOME}/ps3dev
          export PSL1GHT=${HOME}/ps3dev
          export PATH=${HOME}/ps3dev/bin:${HOME}/ps3dev/ppu/bin:$PATH
          git clone --depth=1 https://github.com/ps3dev/PSL1GHT.git /tmp/PSL1GHT
          cd /tmp/PSL1GHT
          make install-ctrl
          make && make install

      - name: Build SPRX
        run: |
          export PS3DEV=${HOME}/ps3dev
          export PSL1GHT=${HOME}/ps3dev
          export PATH=${HOME}/ps3dev/bin:${HOME}/ps3dev/ppu/bin:$PATH
          make V=1
          echo "=== exit code: $? ==="
          echo "=== all files in workspace ==="
          find $GITHUB_WORKSPACE -maxdepth 3 -type f | sort
          echo "=== sprxlinker version ==="
          sprxlinker --version 2>/dev/null || sprxlinker 2>&1 | head -5 || true
          echo "=== run sprxlinker manually ==="
          sprxlinker kbd2trigger.elf kbd2trigger.sprx && echo "sprxlinker OK" || echo "sprxlinker FAILED: $?"
          ls -la kbd2trigger.* 2>/dev/null || echo "no kbd2trigger files found"

      - name: Upload SPRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbd2trigger-sprx
          path: "**/*.sprx"
          if-no-files-found: error
